<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SPDWP To-Do List - Local Storage App</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header class="header">
            <div class="header-content">
                <h1>📋 SPDWP To-Do List</h1>
                <p>Your tasks, auto-saved locally</p>
            </div>
        </header>

        <!-- Main Content -->
        <main class="main-content">
            <!-- Input Section -->
            <section class="input-section">
                <div class="input-group">
                    <input 
                        type="text" 
                        id="taskInput" 
                        class="task-input" 
                        placeholder="What needs to be done? 🤔"
                        autocomplete="off"
                    >
                    <select id="prioritySelect" class="priority-select">
                        <option value="low">Low 🟢</option>
                        <option value="medium" selected>Medium 🟡</option>
                        <option value="high">High 🔴</option>
                    </select>
                    <button id="addBtn" class="btn btn-add">+ Add Task</button>
                </div>
            </section>

            <!-- Statistics Dashboard -->
            <section class="stats-section">
                <div class="stat-card">
                    <div class="stat-value" id="totalCount">0</div>
                    <div class="stat-label">Total Tasks</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="completedCount">0</div>
                    <div class="stat-label">Completed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-value" id="remainingCount">0</div>
                    <div class="stat-label">Remaining</div>
                </div>
                <div class="stat-card">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="stat-label">Progress <span id="progressPercent">0%</span></div>
                </div>
            </section>

            <!-- Filter Buttons -->
            <section class="filter-section">
                <button class="filter-btn active" data-filter="all">All</button>
                <button class="filter-btn" data-filter="active">Active</button>
                <button class="filter-btn" data-filter="completed">Completed</button>
                <button class="filter-btn" data-filter="high">High Priority</button>
                <button class="filter-btn" data-filter="medium">Medium Priority</button>
                <button class="filter-btn" data-filter="low">Low Priority</button>
            </section>

            <!-- Tasks List -->
            <section class="tasks-section">
                <div id="tasksList" class="tasks-list">
                    <!-- Tasks will be added here by JavaScript -->
                    <div class="empty-state">
                        <p>✨ No tasks yet! Add one to get started.</p>
                    </div>
                </div>
            </section>

            <!-- Action Buttons -->
            <section class="actions-section">
                <button id="exportBtn" class="btn btn-secondary">📥 Export Tasks</button>
                <button id="clearCompletedBtn" class="btn btn-secondary">🗑️ Clear Completed</button>
                <button id="clearAllBtn" class="btn btn-danger">⚠️ Clear All</button>
            </section>
        </main>

        <!-- Footer -->
        <footer class="footer">
            <p>💾 Your tasks are automatically saved to local storage</p>
            <p>No internet needed • No accounts required • Your data stays private</p>
        </footer>
    </div>

    <!-- Hidden Element for JSON Template -->
    <template id="taskTemplate">
        <div class="task-item">
            <div class="task-content">
                <input 
                    type="checkbox" 
                    class="task-checkbox"
                    aria-label="Mark task complete"
                >
                <div class="task-text-container">
                    <div class="task-text"></div>
                    <div class="task-date"></div>
                </div>
                <span class="task-priority"></span>
            </div>
            <div class="task-actions">
                <button class="btn btn-icon btn-edit" title="Edit task">✏️</button>
                <button class="btn btn-icon btn-delete" title="Delete task">🗑️</button>
            </div>
        </div>
    </template>

    <script src="app.js"></script>
</body>
</html>
